<svg xmlns="http://w3.org" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Фирменный линейный градиент Wildberries под углом -->
    <linearGradient id="wbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F90479" />      <!-- Малина / Фуксия -->
      <stop offset="50%" stop-color="#7F30E3" />     <!-- Фиолетовый / Ежевика -->
      <stop offset="100%" stop-color="#4B0082" />    <!-- Тёмно-фиолетовый -->
    </linearGradient>
  </defs>

  <!-- Скругленный фон иконки -->
  <rect width="512" height="512" rx="110" fill="url(#wbGradient)" />

  <!-- Буква L в форме сапожка по центру -->
  <path d="M 180,110 
           C 180,110 230,110 230,120 
           L 230,340 
           C 230,370 240,390 280,400 
           L 340,410 
           C 365,415 370,430 350,435 
           L 210,435 
           C 170,435 155,420 155,380 
           L 155,130 
           C 155,110 180,110 180,110 Z" 
        fill="#FFFFFF" />
  
  <!-- Каблучок сапожка для выразительности силуэта буквы L -->
  <path d="M 157,435 L 175,435 L 175,410 L 157,395 Z" fill="#FFFFFF" opacity="0.9"/>
</svg>
